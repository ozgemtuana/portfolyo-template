<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Kişisel portfolyo — Personal portfolio" />
        <meta name="theme-color" content="#07070b" />
        <title>Özgeçmiş</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Şablonun çekirdek CSS'i (Bootstrap dahil) -->
        <link href="css/styles.css" rel="stylesheet" />
        <!-- Koyu tema ve animasyon katmanı -->
        <link href="css/dark.css" rel="stylesheet" />
        <!-- Sayfa geçişi + yükleme ekranı -->
        <link href="css/transition.css" rel="stylesheet" />
        <script>
            /* Geçiş sahnesi/yükleme ekranı için: JS var mı, ilk ziyaret mi? */
            document.documentElement.classList.add("js");
            try { if (!sessionStorage.getItem("visited")) document.documentElement.classList.add("first-visit"); } catch (e) {}
        </script>
    </head>
    <body id="top" class="d-flex flex-column h-100" data-page="resume" data-title="meta.title.resume">
        <canvas id="bg3d" aria-hidden="true"></canvas>
        <div class="grain" aria-hidden="true"></div>
        <div class="scroll-progress" aria-hidden="true"></div>
        <div class="cursor" aria-hidden="true"><span data-i18n="cursor.view">Gör</span></div>
        <!-- Sayfa geçişi sahnesi (js/transition.js) -->
        <div class="pt" aria-hidden="true">
            <svg class="pt-svg" viewBox="0 0 100 100" preserveAspectRatio="none" focusable="false">
                <path class="pt-path pt-path--accent" d="M0 0 L0 100 Q50 100 100 100 L100 0 Z" />
                <path class="pt-path pt-path--mid" d="M0 0 L0 100 Q50 100 100 100 L100 0 Z" />
                <path class="pt-path pt-path--base" d="M0 0 L0 100 Q50 100 100 100 L100 0 Z" />
                <path class="pt-path pt-path--fill" d="" />
            </svg>
            <div class="pt-content">
                <div class="pt-top"><span class="pt-label"></span><span class="pt-meta"></span></div>
                <div class="pt-bottom">
                    <div class="pt-stage">
                        <em class="pt-word"><span class="pt-word-in"></span></em>
                        <div class="pt-line"><span class="pt-name"></span><span class="pt-count"><b>0</b><em>%</em></span></div>
                    </div>
                    <span class="pt-rule"><i></i></span>
                    <div class="pt-foot"><span data-profile="name">Adın Soyadın</span><span class="pt-of"></span></div>
                </div>
            </div>
        </div>
        <script>
            /* Geçişle gelindiyse hedef başlığı ilk karede yaz (boş kare görünmesin) */
            (function () {
                try {
                    var d = JSON.parse(sessionStorage.getItem("pt-dest") || "null"), p = document.querySelector(".pt");
                    if (!d || !p || d.page !== document.body.dataset.page || Date.now() - d.ts > 8000) return;
                    p.classList.add("is-arrived");
                    p.querySelector(".pt-name").textContent = d.name;
                    p.querySelector(".pt-word-in").textContent = d.word;
                    p.querySelector(".pt-label").textContent = d.label;
                    p.querySelector(".pt-meta").textContent = d.meta;
                    p.querySelector(".pt-of").textContent = d.of;
                } catch (e) {}
            })();
        </script>

        <main class="flex-shrink-0">
            <!-- Navigation-->
            <nav class="navbar navbar-expand-lg navbar-dark py-3">
                <div class="container px-5">
                    <a class="navbar-brand" href="index.html"><span class="fw-bolder text-gradient" data-profile="name">Adın Soyadın</span></a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" data-i18n-aria="nav.toggle" aria-label="Menüyü aç/kapat"><span class="navbar-toggler-icon"></span></button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 small fw-bolder align-items-lg-center gap-lg-2">
                            <li class="nav-item"><a class="nav-link" data-nav="home" data-scramble href="index.html" data-i18n="nav.home">Ana Sayfa</a></li>
                            <li class="nav-item"><a class="nav-link" data-nav="resume" data-scramble href="resume.html" data-i18n="nav.resume">Özgeçmiş</a></li>
                            <li class="nav-item"><a class="nav-link" data-nav="projects" data-scramble href="projects.html" data-i18n="nav.projects">Projeler</a></li>
                            <li class="nav-item"><a class="nav-link" data-nav="contact" data-scramble href="contact.html" data-i18n="nav.contact">İletişim</a></li>
                            <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                                <div class="lang-switch" role="group" aria-label="Dil / Language">
                                    <button type="button" data-lang="tr">TR</button>
                                    <button type="button" data-lang="en">EN</button>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>

            <!-- Page Content-->
            <div class="container px-5 page-offset my-5">
                <div class="mb-5 pt-4">
                    <div class="eyebrow mb-3" data-reveal data-profile="location">Şehir, TR</div>
                    <h1 class="display-2 fw-bolder mb-3" data-reveal><span class="text-gradient d-inline" data-i18n-html="resume.title">Özgeçmiş</span></h1>
                    <p class="hero-sub" data-reveal data-i18n="resume.sub">Eğitimim, deneyimlerim ve kullandığım teknolojiler.</p>
                </div>
                <div class="row gx-5 justify-content-center">
                    <div class="col-lg-11 col-xl-10">
                        <!-- Experience Section-->
                        <section class="mb-5">
                            <div class="d-flex flex-wrap gap-3 align-items-center justify-content-between mb-4" data-reveal>
                                <h2 class="text-primary fw-bolder mb-0" data-i18n="resume.exp">Deneyim</h2>
                                <!-- CV dosyanı assets/cv.pdf olarak ekle -->
                                <a class="btn btn-primary px-4 py-3 magnetic" href="assets/cv.pdf" download>
                                    <div class="d-inline-block bi bi-download me-2"></div>
                                    <span data-i18n="resume.download">CV İndir</span>
                                </a>
                            </div>
                            <!-- Kartlar js/content.js > experience listesinden basılır -->
                            <div class="timeline" data-render="experience"></div>
                        </section>

                        <!-- Education Section-->
                        <section class="mb-5">
                            <h2 class="text-secondary fw-bolder mb-4" data-reveal data-i18n="resume.edu">Eğitim</h2>
                            <!-- Kartlar js/content.js > education listesinden basılır -->
                            <div class="timeline" data-render="education"></div>
                        </section>

                        <!-- Skills Section-->
                        <section class="mb-5">
                            <div class="card rounded-4 mb-5" data-reveal>
                                <div class="card-body p-5">
                                    <div class="mb-5">
                                        <div class="d-flex align-items-center mb-4">
                                            <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 me-3"><i class="bi bi-tools"></i></div>
                                            <h3 class="fw-bolder mb-0"><span class="text-gradient d-inline" data-i18n="resume.skills">Yetenekler</span></h3>
                                        </div>
                                        <div data-render="skills"></div>
                                    </div>
                                    <div class="mb-5">
                                        <div class="d-flex align-items-center mb-4">
                                            <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 me-3"><i class="bi bi-bar-chart"></i></div>
                                            <h3 class="fw-bolder mb-0"><span class="text-gradient d-inline" data-i18n="resume.prof">Uzmanlık</span></h3>
                                        </div>
                                        <div class="row g-4" data-render="skillbars"></div>
                                    </div>
                                    <div>
                                        <div class="d-flex align-items-center mb-4">
                                            <div class="feature bg-primary bg-gradient-primary-to-secondary text-white rounded-3 me-3"><i class="bi bi-translate"></i></div>
                                            <h3 class="fw-bolder mb-0"><span class="text-gradient d-inline" data-i18n="resume.langs">Diller</span></h3>
                                        </div>
                                        <div class="row row-cols-1 row-cols-md-3 g-3" data-render="languages"></div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer-->
        <footer class="site-footer pt-5 mt-auto">
            <div class="container px-5">
                <div class="row align-items-center justify-content-between flex-column flex-sm-row gap-3">
                    <div class="col-auto d-flex gap-4">
                        <a data-profile="github" data-profile-href href="#" data-scramble>GitHub</a>
                        <a data-profile="instagram" data-profile-href href="#" data-scramble>Instagram</a>
                        <a data-profile="linkedin" data-profile-href href="#" target="_blank" rel="noopener" data-scramble hidden>LinkedIn</a>
                    </div>
                    <div class="col-auto d-flex gap-4">
                        <a href="https://startbootstrap.com/theme/personal" target="_blank" rel="noopener" data-i18n="footer.template" data-scramble>Şablon</a>
                        <a href="#top" class="to-top" data-i18n="footer.up" data-scramble>Yukarı ↑</a>
                    </div>
                </div>
            </div>
            <h2 class="footer-name text-center" aria-hidden="true" data-profile="name">Adın Soyadın</h2>
            <div class="container px-5 py-3">
                <div class="small text-muted text-center" data-i18n="footer.copy">© 2026</div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
        <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="js/content.js"></script>
        <script src="js/i18n.js"></script>
        <script src="js/transition.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
